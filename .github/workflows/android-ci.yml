name: Validate Android WebView shell

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Restore stable signing key or generate temporary CI key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
          DEBUG_STORE_PASSWORD: ${{ secrets.ANDROID_DEBUG_STORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.ANDROID_DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "Stable debug signing key restored."
          else
            echo "::warning::Stable Android signing secrets are not configured; this APK cannot update installs signed by previous ephemeral keys."
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Android Debug,O=Android,C=US'
          fi
          echo "DEBUG_STORE_PASSWORD=${DEBUG_STORE_PASSWORD:-android}" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_ALIAS=${DEBUG_KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
          echo "DEBUG_KEY_PASSWORD=${DEBUG_KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
      - name: Compile and assemble Debug APK
        run: ./gradlew --no-daemon --no-configuration-cache assembleDebug
      - name: Run unit tests (retry transient repository failures)
        run: |
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --no-configuration-cache testDebugUnitTest; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Gradle test dependency download failed; retrying ($attempt/3)."
              sleep $((attempt * 15))
            fi
          done
          exit 1
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DD-Android-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
