[versions]
agp = "9.5.3"
coreKtx = "1.19.1"
junit = "4.13.2"
junitVersion = "1.3.0"
lifecycleRuntimeKtx = "2.11.1"
googleDevtoolsKsp = "2.3.14"
roomRuntime = "2.8.5"
roomKtx = "2.8.5"
roomCompiler = "2.8.5"
kotlinxCoroutinesTest = "1.11.0"
core = "1.7.0"
runner = "1.7.0"
kotlinxCoroutinesAndroid = "1.11.0"
kotlinxCoroutinesCore = "1.11.0"
robolectric = "4.18.1"

[libraries]
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version = "1.13.0" }
androidx-webkit = { group = "androidx.webkit", name = "webkit", version = "1.18.0" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "roomRuntime" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "roomKtx" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "roomCompiler" }
androidx-room-testing = { group = "androidx.room", name = "room-testing", version.ref = "roomRuntime" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutinesTest" }
